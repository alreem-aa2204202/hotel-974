function paymentPlan(total) {
  const cents = Math.round(total*100);
  const amount = app.paymentPortion==='half'?Math.round(cents/2):cents;
  return {amount:amount/100,balance:(cents-amount)/100,method:app.paymentMethod};
}

function guestAge(birth) {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(birth)||birth>day()) return NaN;
  const date = new Date(birth+'T00:00:00Z');
  if(!Number.isFinite(date.getTime())||date.toISOString().slice(0,10)!==birth) return NaN;
  const today = day();
  return Number(today.slice(0,4))-Number(birth.slice(0,4))-(today.slice(5)<birth.slice(5)?1:0);
}

function roomQuote(rate,nights) {
  const standard = rate*nights;
  let eligible = 0;
  if(app.member) {
    // Full weeks always contain five eligible nights. Check the remaining dates in UTC.
    eligible = Math.floor(nights/7)*5;
    const firstDay = new Date(app.start).getUTCDay();
    for(let i=0;i<nights%7;i++) {
      if((firstDay+i)%7<5) eligible++;
    }
  }
  const savings = Math.round(eligible*rate*10)/100;
  return {standard,savings,eligible,total:standard-savings};
}

function art(kind, alt='') {
  return '<img class="art" src="data:image/jpeg;base64,'+photos[kind]+'" alt="'+alt+'" decoding="async">';
}

function roomCard(room) {
  return '<article class="card">'+art(room.id,textOf(room.name))+'<div class="card-body"><h2>'+textOf(room.name)+'</h2><p class="meta">'+roomMeta(room)+'</p><div class="spread"><span class="rate">'+money(room.rate)+' <span class="meta">'+t('/ ليلة','/ night')+'</span></span><button class="link" data-detail="'+room.id+'">'+t('عرض التفاصيل','View details')+' '+arrow()+'</button></div></div></article>';
}
function roomMeta(room) {
  return num(room.size)+' '+t('م²','m²')+' · '+t('حتى ','Up to ')+num(room.max)+t(' ضيوف',' guests');
}
function home() {
  const features = [
    ['rooms','bed',t('غرف وأجنحة','Rooms & suites')],
    ['book','calendar',t('حجز مرن','Flexible booking')],
    ['services','service',t('ضيافة قطرية','Qatari hospitality')]
  ];
  return '<section class="hero">'+art('hero',t('تصور لواجهة الفندق من حاويات متصلة','Concept view of the hotel built from connected containers'))+'<div><div class="location">'+icon('pin')+' '+t('الدوحة، قطر','Doha, Qatar')+'</div><h1>'+t('إقامة فاخرة <em>بروح قطرية</em>','Luxury stays <em>with Qatari spirit</em>')+'</h1><p>'+t('فندق بوتيك خيالي يعيد تخيّل حاويات استاد 974 كغرف وأجنحة عصرية.','A fictional boutique hotel that reimagines Stadium 974 containers as contemporary rooms and suites.')+'</p>'+button('book',t('ابدأ الحجز التجريبي','Try a demo booking'),'gold')+'</div></section>'+
    '<section class="section"><span class="overline">'+t('تجربة الضيف','THE GUEST EXPERIENCE')+'</span><h2>'+t('اكتشف فندق 974','Discover 974 Hotel')+'</h2><div class="features">'+features.map(([page,symbol,label])=>'<button class="feature" data-page="'+page+'">'+icon(symbol)+label+'</button>').join('')+'</div></section>'+
    '<section class="section"><div class="spread"><h2>'+t('إقامة مختارة','A featured stay')+'</h2><button class="link" data-page="rooms">'+t('كل الغرف','All rooms')+' '+arrow()+'</button></div>'+roomCard(rooms[1])+button('book',t('جرّب الحجز الآن','Try booking now'),'full')+'<p class="notice">'+note()+'</p></section>';
}
function roomList() {

const dialog = $('assistant');
const messages = [];
const intro = () => t('هلا بك في فندق 974! اسأليني عن الأسعار، الحجز، المرافق أو سعة قاعة المناسبات.','Welcome to 974 Hotel! Ask me about rates, booking, amenities or event hall capacity.');
const prompts = [
  ['الأسعار','Room rates'],['كيف أحجز؟','How do I book?'],['المرافق','Amenities'],['سعة القاعة','Hall capacity']
];
function openAssistant() {
  dialog.setAttribute('aria-labelledby','chat-label');
  dialog.innerHTML = '<div class="chat"><div class="chat-title">'+guideAvatar+'<div><h2 id="chat-label">'+t('مساعد فندق 974','974 Hotel AI guide')+'</h2><p>'+t('محاكاة AI · إجابات مبرمجة تعمل دون إنترنت','AI simulation · scripted offline replies')+'</p></div><button class="square" data-close aria-label="'+t('إغلاق','Close')+'">'+icon('close')+'</button></div>'+
    '<div class="messages" id="messages" role="log" aria-live="polite"></div><div class="chips">'+prompts.map((prompt,i)=>'<button class="chip" data-prompt="'+i+'">'+textOf(prompt)+'</button>').join('')+'</div>'+
    '<form class="chat-form" id="chat-form"><input name="question" maxlength="200" autocomplete="off" aria-label="'+t('سؤالك','Your question')+'" placeholder="'+t('اكتبي سؤالك…','Type your question…')+'"><button class="cta" type="submit">'+t('إرسال','Send')+'</button></form></div>';
  renderMessages();
  dialog.showModal();
  $('messages').scrollTop = $('messages').scrollHeight;
}
function renderMessages() {
  const area = $('messages');
  area.replaceChildren();
  for(const [role,content] of [['bot',intro()],...messages]) {
    const bubble = document.createElement('p');
    bubble.className = 'bubble '+role;
    bubble.dir = 'auto';
    bubble.textContent = content;
    area.append(bubble);
  }
  area.scrollTop = area.scrollHeight;
}
function answer(question) {
  const normalized = question.toLowerCase().replace(/[٠-٩]/g,char=>'٠١٢٣٤٥٦٧٨٩'.indexOf(char));
  if(/قاعة|القاعة|اجتماع|مناسب|حضور|hall|event|meeting|attendees|capacity/.test(normalized)) {
    const count = Number(normalized.match(/\b\d+\b/)?.[0]);
    if(Number.isFinite(count)) {
      if(count<10||count>200) return t('تستوعب القاعة من ١٠ إلى ٢٠٠ شخص في هذا النموذج.','The hall accommodates 10 to 200 people in this prototype.');
      return t('لعدد '+num(count)+' شخص، نقترح '+num(modules(count))+' حاويات متصلة. افتحي «حجز القاعة» من الخدمات لتجربة الحجز.','For '+num(count)+' attendees, we suggest '+num(modules(count))+' connected containers. Open “Book the event hall” from Services to try it.');
    }
    return t('القاعة تستوعب من ١٠ إلى ٢٠٠ شخص. ١٠–٢٠ شخص يحتاجون حاويتين، و٢١–٤٠ يحتاجون ثلاثًا. افتحي «حجز القاعة» من الخدمات لتحديد العدد.','The hall fits 10–200 people. 10–20 people use two containers and 21–40 use three. Open “Book the event hall” from Services to choose a capacity.');
  }
  if(/سعر|اسعار|أسعار|تكلف|rates|price|cost|غرف|rooms/.test(normalized)) {
    return t('الأسعار التجريبية لليلة واحدة: ','Demo nightly rates: ')+rooms.map(room=>textOf(room.name)+' '+money(room.rate)).join(t('، ', ', '))+'.';
  }
  const wellness = [
    ['pool',/مسبح|سباح|pool|swim/],
    ['spa',/سبا|جاكوزي|\bspa\b|whirlpool/],
    ['sauna',/ساونا|سونا|sauna/]
  ].filter(([,pattern])=>pattern.test(normalized));
  if(wellness.length) {
    return wellness.map(([key])=>{
      const [, ,ar,en,arDesc,enDesc] = amenities.find(([photo])=>photo===key);
      return t(ar,en)+' · '+t(arDesc,enDesc);
    }).join(' ');
  }
  if(/مطعم|مرافق|خدمات|مزرع|رياض|لياقة|قهوة|amenit|service|restaurant|garden|gym/.test(normalized)) {
    return t('تلقين هالمرافق في تبويب «الخدمات» · ','Explore these amenities under Services · ')+amenities.map(([, ,ar,en])=>t(ar,en)).join(t('، ', ', '))+'.';
  }
  if(/حجز|دفع|تواريخ|booking|book|dates|pay/.test(normalized)) {
    return t('افتحي «الحجز»، اختاري الغرفة والتواريخ وعدد الضيوف واضغطي «تأكيد الحجز التجريبي».','Open Book, choose your room, dates and guests, then select “Confirm demo booking”.');
  }
  if(/أين|وين|موقع|الدوحة|location|where|doha/.test(normalized)) {
    return t('فندق 974 فكرة لفندق بوتيك في الدوحة، قطر، مستوحاة من حاويات استاد 974.','974 Hotel is a fictional boutique hotel in Doha, Qatar, inspired by Stadium 974 containers.');
  }
  return t('أقدر أساعدك في أسعار الغرف، طريقة الحجز، المرافق وسعة القاعة. جرّبي مثلًا «قاعة لـ ٤٠ شخص».','I can help with room rates, booking, amenities and hall capacity. Try “hall for 40 people”.');
}
function ask(question) {
  const value = question.trim();
  if(!value) return;
  messages.push(['user',value],['bot',answer(value)]);
  renderMessages();
}

document.addEventListener('click',event=>{
  const el = event.target.closest('button');
  if(!el) return;
  const d = el.dataset;
  if('lang' in d) {
    lang = 1-lang;
    renderShell();
    renderView();
    document.querySelector('[data-lang]').focus();
  } else if('assistant' in d) openAssistant();
  else if('close' in d) dialog.close();
  else if('prompt' in d) ask(textOf(prompts[Number(d.prompt)]));
  else if(d.cancelBooking) openCancellation(d.cancelBooking);
  else if('dismissCancel' in d) $('cancel-dialog').close();
  else if(d.confirmCancel) confirmCancellation(d.confirmCancel);
  else if('sampleGuest' in d) fillSampleGuest(el.form);
  else if('joinClub' in d) { app.member = '974-0101'; go('profile'); }
  else if(d.page) go(d.page);
  else if(d.detail) { app.detail = d.detail; go('detail'); }
  else if(d.filter) { app.filter = d.filter; renderView(); document.querySelector('[data-filter="'+d.filter+'"]').focus(); }
  else if(d.bookRoom) {
    app.room = d.bookRoom;
    app.guests = Math.min(app.guests,roomById(app.room).max);
    app.confirmation = null;
    go('book');
  } else if(d.guest) {
    app.guests = Math.max(1,Math.min(roomById(app.room).max,app.guests+Number(d.guest)));
    updateSummary();
  } else if('newBooking' in d) { app.confirmation = null; go('book'); }
  else if('newHall' in d) { hallState.confirmation = null; go('hall'); }
  else if(d.capacity) {
    hallState.count = Number(d.capacity);
    $('hall-form').elements.count.value = hallState.count;
    updateHallSummary();
    $('hall-form').elements.count.focus();
  }
});
document.addEventListener('input',event=>{
  const field = event.target;
  if(field.form?.id==='booking-form') {
    $('form-error').textContent = '';
    if(['room','start','end','paymentPortion','paymentMethod'].includes(field.name)) {
      app[field.name] = field.value;
      if(field.name==='room') app.guests = Math.min(app.guests,roomById(app.room).max);
      updateSummary();
    }
  }
  if(field.form?.id==='hall-form') {
    $('hall-error').textContent = '';
    if(['count','date','time','type'].includes(field.name)) {
      hallState[field.name] = field.name==='count'?field.valueAsNumber:field.value;
      updateHallSummary();
    }
  }
});
document.addEventListener('submit',event=>{
  const form = event.target;
  if(form.id==='chat-form') {
    event.preventDefault();
    ask(form.elements.question.value);
    form.reset();
    form.elements.question.focus();
  }
  if(form.id==='club-form') {
    event.preventDefault();
    if(form.elements.card.value.trim()!==linkedCard) {
      $('club-error').textContent = t('استخدمي رقم البطاقة التجريبية ','Use demo card number ')+linkedCard+'.';
      form.elements.card.focus();
      return;
    }
    app.member = linkedCard;
    go('profile');
  }
  if(form.id==='booking-form') {
    event.preventDefault();
    const nights = nightCount();
    if(app.start<day()||!Number.isInteger(nights)||nights<=0) {
      $('form-error').textContent = t('تاريخ الخروج لازم يكون بعد تاريخ الدخول.','Check-out must be after check-in.');
      form.elements.end.focus();
      return;
    }
    const {personalId,birth,idImage} = form.elements;
    const number = asciiDigits(personalId.value.trim());
    const age = guestAge(birth.value);
    const image = idImage.files[0];
    const issues = [
      ...contactIssues(form),
      [personalId,!/^\d{11}$/.test(number),t('أدخلي رقمًا تجريبيًا من ١١ رقمًا.','Enter an 11-digit sample ID number.')],
      [birth,!Number.isFinite(age)||age<21,t('لازم يكون عمر الضيف ٢١ سنة أو أكثر عشان يحجز.','The guest must be at least 21 to book.')],
      [idImage,!image||!allowedIdImages.includes(image.type)||!image.size||image.size>maxIdImageSize,t('ارفعي صورة بطاقة تجريبية بصيغة JPG أو PNG أو WebP حتى ٥ ميغابايت.','Attach a sample JPG, PNG or WebP ID image up to 5 MB.')]
    ];
    const issue = issues.find(([,invalid])=>invalid);
    if(issue) {
      $('form-error').textContent = issue[2];
      issue[0].focus();
      return;
    }
    const {total,savings} = roomQuote(roomById(app.room).rate,nights);
    const b = {ref:'974-R'+String(app.bookings.length+1).padStart(3,'0'),room:app.room,start:app.start,end:app.end,guests:app.guests,total,savings,payment:paymentPlan(total)};
    app.bookings.unshift(b);
    app.confirmation = b;
    go('book');
  }
  if(form.id==='hall-form') {
    event.preventDefault();
    const count = form.elements.count.valueAsNumber;
    if(!Number.isInteger(count)||count<10||count>200||form.elements.date.value<day()) return;
    const issue = contactIssues(form).find(([,invalid])=>invalid);
    if(issue) {
      $('hall-error').textContent = issue[2];
      issue[0].focus();
      return;
    }
    const b = {ref:'974-H'+String(hallBookings.length+1).padStart(3,'0'),count,date:form.elements.date.value,time:form.elements.time.value,type:form.elements.type.value};
    hallBookings.unshift(b);
    hallState.confirmation = b;
    go('hall');
  }
});
renderShell();
renderView();
</script>
</body>
</html>
